{% extends "auth/base.html" %}

{% block title %}Forgot Password - AP Studio{% endblock %}

{% block content %}
<h2>Forgot Password</h2>
<p style="text-align: center; color: #4b5563; margin-bottom: 1rem;">Enter your email to receive a password reset code.</p>
<form method="post" action="{% url 'auth:forgot_password' %}">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_email">Email Address</label>
        {{ form.email }}
    </div>
    <button type="submit">Send Reset Code</button>
</form>
<div class="links">
    <p>Remember your password? <a href="{% url 'auth:login' %}">Log In</a></p>
</div>
{% endblock %}
