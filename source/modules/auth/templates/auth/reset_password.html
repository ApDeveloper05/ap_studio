{% extends "auth/base.html" %}

{% block title %}Reset Password - AP Studio{% endblock %}

{% block content %}
<h2>Reset Password</h2>
<form method="post" action="{% url 'auth:reset_password' %}">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_otp">6-Digit Reset Code (OTP)</label>
        {{ form.otp }}
    </div>
    <div class="form-group">
        <label for="id_password">New Password</label>
        {{ form.password }}
    </div>
    <div class="form-group">
        <label for="id_confirm_password">Confirm New Password</label>
        {{ form.confirm_password }}
    </div>
    <button type="submit">Reset Password</button>
</form>
{% endblock %}
