{% extends "auth/base.html" %}

{% block title %}Verify Email - AP Studio{% endblock %}

{% block content %}
<h2>Verify Your Email</h2>
<p style="text-align: center; color: #4b5563; margin-bottom: 1rem;">We've sent a verification email to your address. Please click the link in the email or enter the OTP below if applicable.</p>
<form method="post" action="{% url 'auth:verify_email' user.id %}">
    {% csrf_token %}
    <button type="submit">Resend Verification Email / Verify</button>
</form>
{% endblock %}
